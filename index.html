<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Учет расходов</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.7);
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #007aff;
            --radius-lg: 24px;
            --radius-md: 14px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            --border: 1px solid rgba(255, 255, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            /* Легкий градиентный фон */
            background-image: radial-gradient(circle at 0% 0%, #ffffff 0%, transparent 50%),
                              radial-gradient(circle at 100% 100%, #e2e2e8 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .header {
            max-width: 1000px;
            margin: 0 auto 24px auto;
            padding: 0 10px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Десктопная компоновка */
        @media (min-width: 768px) {
            .bento-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: minmax(180px, auto);
            }
            .card-balance { grid-column: span 2; grid-row: span 1; }
            .card-add { grid-column: span 1; grid-row: span 2; }
            .card-history { grid-column: span 2; grid-row: span 1; }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Карточка баланса */
        .balance-amount {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1.5px;
            margin-top: auto;
            margin-bottom: auto;
        }

        /* Форма добавления */
        .input-group {
            margin-bottom: 16px;
        }

        input, select {
            width: 100%;
            background: rgba(0,0,0,0.04);
            border: none;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-size: 16px;
            color: var(--text-main);
            outline: none;
            transition: background 0.2s;
        }

        input:focus, select:focus {
            background: rgba(0,0,0,0.08);
        }

        button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: auto;
        }

        button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* История транзакций */
        .history-list {
            list-style: none;
            overflow-y: auto;
            max-height: 250px;
        }

        /* Скрываем скроллбар для эстетики */
        .history-list::-webkit-scrollbar { display: none; }
        .history-list { -ms-overflow-style: none; scrollbar-width: none; }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-name {
            font-weight: 500;
            font-size: 16px;
        }

        .item-category {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .item-amount {
            font-weight: 600;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Сводка</h1>
    </div>

    <div class="bento-grid">
        <!-- Карточка итоговой суммы -->
        <div class="card card-balance">
            <div class="card-title">Потрачено за месяц</div>
            <div class="balance-amount" id="totalExpense">0 ₽</div>
        </div>

        <!-- Форма новой записи -->
        <div class="card card-add">
            <div class="card-title">Новый расход</div>
            
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="Название (например, Кофе)" required>
            </div>
            
            <div class="input-group">
                <input type="number" id="amountInput" placeholder="Сумма (₽)" required>
            </div>
            
            <div class="input-group">
                <select id="categoryInput">
                    <option value="Питание">Питание</option>
                    <option value="Транспорт">Транспорт</option>
                    <option value="Подписки">Подписки</option>
                    <option value="Развлечения">Развлечения</option>
                    <option value="Быт">Быт</option>
                </select>
            </div>

            <button onclick="addTransaction()">Добавить</button>
        </div>

        <!-- История -->
        <div class="card card-history">
            <div class="card-title">Последние операции</div>
            <ul class="history-list" id="historyList">
                <!-- Сюда добавляются записи через JS -->
            </ul>
        </div>
    </div>

    <script>
        // Имитация локального хранилища/БД
        let transactions = [];

        const totalExpenseEl = document.getElementById('totalExpense');
        const historyListEl = document.getElementById('historyList');
        const nameInput = document.getElementById('nameInput');
        const amountInput = document.getElementById('amountInput');
        const categoryInput = document.getElementById('categoryInput');

        // Стартовые данные для визуализации
        function initDummyData() {
            addRecord('Такси', 850, 'Транспорт');
            addRecord('Яндекс Музыка', 299, 'Подписки');
            addRecord('Супермаркет', 3200, 'Питание');
        }

        function addRecord(name, amount, category) {
            const transaction = {
                id: Date.now().toString(),
                name,
                amount: parseFloat(amount),
                category,
                date: new Date()
            };
            transactions.unshift(transaction); // Добавляем в начало массива
            updateUI();
        }

        // Обработка кнопки
        function addTransaction() {
            const name = nameInput.value.trim();
            const amount = amountInput.value.trim();
            const category = categoryInput.value;

            if (!name || !amount) {
                alert('Заполните название и сумму');
                return;
            }

            addRecord(name, amount, category);
            
            // Очистка полей
            nameInput.value = '';
            amountInput.value = '';
            nameInput.focus();
        }

        // Форматирование чисел в рубли
        function formatMoney(amount) {
            return new Intl.NumberFormat('ru-RU', {
                style: 'currency',
                currency: 'RUB',
                maximumFractionDigits: 0
            }).format(amount);
        }

        // Обновление DOM
        function updateUI() {
            const total = transactions.reduce((acc, curr) => acc + curr.amount, 0);
            totalExpenseEl.textContent = formatMoney(total);

            historyListEl.innerHTML = '';
            
            if(transactions.length === 0) {
                historyListEl.innerHTML = '<div style="color: var(--text-secondary); text-align: center; margin-top: 20px;">Нет транзакций</div>';
                return;
            }

            transactions.forEach(t => {
                const li = document.createElement('li');
                li.className = 'history-item';
                
                li.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${t.name}</span>
                        <span class="item-category">${t.category}</span>
                    </div>
                    <div class="item-amount">
                        -${formatMoney(t.amount)}
                    </div>
                `;
                historyListEl.appendChild(li);
            });
        }

        // Сабмит по клавише Enter в поле суммы
        amountInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTransaction();
        });

        initDummyData();
    </script>
</body>
</html>
