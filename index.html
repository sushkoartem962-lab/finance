<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance Tracker - Bento & Firebase Ready</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #007aff;
            --primary-hover: #0056b3;
            --text-main: #1c1c1e;
            --text-muted: #8e8e93;
            --danger: #ff3b30;
            --success: #34c759;
            --radius: 24px;
            --spacing: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); -webkit-font-smoothing: antialiased; }
        .container { max-width: 1200px; margin: 0 auto; padding: var(--spacing); padding-bottom: 100px; }

        /* Навигация */
        .nav { display: flex; gap: 10px; margin-bottom: var(--spacing); overflow-x: auto; scrollbar-width: none; }
        .nav::-webkit-scrollbar { display: none; }
        .nav-btn { background: var(--card-bg); border: none; padding: 12px 20px; border-radius: 100px; font-size: 16px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
        .nav-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }

        /* Бенто-сетка */
        .bento-grid { display: grid; gap: var(--spacing); grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
        .bento-card { background: var(--card-bg); border-radius: var(--radius); padding: var(--spacing); box-shadow: 0 4px 20px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
        .bento-card.span-2 { grid-column: span 2; }
        .bento-card.span-3 { grid-column: 1 / -1; }
        
        @media (max-width: 768px) {
            .bento-card.span-2, .bento-card.span-3 { grid-column: span 1; }
            .nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); margin: 0; padding: 15px 10px; padding-bottom: env(safe-area-inset-bottom, 15px); border-radius: 24px 24px 0 0; justify-content: space-around; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); z-index: 1000; }
            .nav-btn { font-size: 14px; padding: 10px 15px; }
        }

        /* Типографика */
        h2 { font-size: 20px; margin-bottom: 15px; font-weight: 600; }
        .amount { font-size: 32px; font-weight: 700; margin-bottom: 5px; }
        .amount.income { color: var(--success); }
        .amount.expense { color: var(--text-main); }
        .subtitle { color: var(--text-muted); font-size: 14px; }
        
        .live-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--primary); background: rgba(0, 122, 255, 0.1); padding: 4px 10px; border-radius: 100px; margin-top: 10px; font-weight: 500; }
        .live-status.loading { color: #ff9500; background: rgba(255, 149, 0, 0.1); }

        /* Формы и элементы */
        input, select, button { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e5e5ea; margin-bottom: 10px; font-size: 16px; background: #fafafa; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }
        .btn-primary { background: var(--primary); color: #fff; border: none; font-weight: 600; cursor: pointer; margin-top: 5px; }
        .btn-primary:hover { background: var(--primary-hover); }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f2f2f7; }
        .list-item:last-child { border-bottom: none; }
        .list-item-title { font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .category-tag { display: inline-block; background: var(--bg-color); padding: 6px 12px; border-radius: 100px; font-size: 14px; margin: 4px; }
        .action-btn { color: var(--danger); font-weight: bold; cursor: pointer; font-size: 18px; line-height: 1; margin-left: 10px; border: none; background: none; padding: 0; width: auto; }

        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .chart-container { position: relative; height: 250px; width: 100%; }
        .flex-row { display: flex; gap: 10px; }
        .analytics-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .analytics-controls select { margin-bottom: 0; width: auto; flex-grow: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('month')">Текущий месяц</button>
        <button class="nav-btn" onclick="switchTab('accounts')">Мои счета</button>
        <button class="nav-btn" onclick="switchTab('analytics')">Аналитика</button>
    </div>

    <!-- Вкладка 1: Текущий месяц -->
    <div id="month" class="tab-content active">
        <div class="bento-grid">
            <div class="bento-card">
                <h2>Баланс августа</h2>
                <div class="amount income" id="month-income-total">+ 0 ₽</div>
                <div class="subtitle">Доходы</div>
                <div class="amount expense" id="month-expense-total" style="margin-top: 15px;">- 0 ₽</div>
                <div class="subtitle">Расходы</div>
            </div>

            <div class="bento-card">
                <h2>Траты текущего месяца</h2>
                <div class="chart-container" style="height: 180px;">
                    <canvas id="currentMonthChart"></canvas>
                </div>
                <div id="current-month-expenses-list" style="margin-top: 15px;"></div>
            </div>

            <div class="bento-card">
                <h2>Операция</h2>
                <select id="op-type" onchange="updateOpCategories()">
                    <option value="expense">Расход</option>
                    <option value="income">Доход</option>
                </select>
                <input type="number" placeholder="Сумма (₽)" id="op-amount">
                <select id="op-category"></select>
                <button class="btn-primary" onclick="addTransaction()">Добавить</button>
            </div>

            <div class="bento-card">
                <h2>Настройка расходов</h2>
                <div class="flex-row">
                    <input type="text" id="new-exp-category" placeholder="Новая категория" style="margin:0;">
                    <button class="btn-primary" style="margin:0; width: 80px;" onclick="addCategory('expense')">+</button>
                </div>
                <div id="exp-categories-list" style="margin-top: 15px;"></div>
            </div>

            <div class="bento-card">
                <h2>Настройка доходов</h2>
                <div class="flex-row">
                    <input type="text" id="new-inc-category" placeholder="Новый источник" style="margin:0;">
                    <button class="btn-primary" style="margin:0; width: 80px;" onclick="addCategory('income')">+</button>
                </div>
                <div id="inc-categories-list" style="margin-top: 15px;"></div>
            </div>
        </div>
    </div>

    <!-- Вкладка 2: Мои счета -->
    <div id="accounts" class="tab-content">
        <div class="bento-grid">
            <div class="bento-card">
                <h2>Общий капитал</h2>
                <div class="amount" id="total-capital">Загрузка...</div>
                <div class="live-status loading" id="rates-status">⏳ Обновление курсов...</div>
                <div class="chart-container" style="margin-top: 20px;">
                    <canvas id="accountsChart"></canvas>
                </div>
            </div>

            <div class="bento-card">
                <h2>Добавить счет</h2>
                <input type="text" id="new-acc-name" placeholder="Название (напр. Bybit)">
                <select id="new-acc-type" onchange="toggleCoinInput()">
                    <option value="fiat">Фиат (Рубли)</option>
                    <option value="crypto">Крипта</option>
                </select>
                <input type="text" id="new-acc-coin" placeholder="Тикер (USDT, BTC, ETH)" style="display:none;">
                <input type="number" id="new-acc-balance" placeholder="Баланс">
                <button class="btn-primary" onclick="addAccount()">Создать счет</button>
            </div>

            <div class="bento-card span-2">
                <h2>Список счетов</h2>
                <div id="accounts-list"></div>
            </div>
        </div>
    </div>

    <!-- Вкладка 3: Аналитика -->
    <div id="analytics" class="tab-content">
        <div class="bento-grid">
            <div class="bento-card span-2">
                <div class="analytics-controls">
                    <h2 style="margin:0;">Динамика Расходов</h2>
                    <select id="analytics-exp-select" onchange="updateAnalyticsCharts()"></select>
                </div>
                <div class="chart-container"><canvas id="chartExpHistory"></canvas></div>
            </div>

            <div class="bento-card span-2">
                <div class="analytics-controls">
                    <h2 style="margin:0;">Динамика Доходов</h2>
                    <select id="analytics-inc-select" onchange="updateAnalyticsCharts()"></select>
                </div>
                <div class="chart-container"><canvas id="chartIncHistory"></canvas></div>
            </div>

            <div class="bento-card">
                <h2>Доход с Крипты (PnL)</h2>
                <div class="chart-container"><canvas id="chartCryptoHistory"></canvas></div>
            </div>

            <div class="bento-card">
                <h2>Тренд (Доходы vs Расходы)</h2>
                <div class="chart-container"><canvas id="chartTrend"></canvas></div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Архитектура Firebase RTDB (Обертка) ---
    const DB = {
        // TODO: В будущем подключи SDK: import { getDatabase, ref, set, get } from "firebase/database";
        async load() {
            // Имитация загрузки из БД
            const local = localStorage.getItem('financeState');
            if (local) return JSON.parse(local);
            return null;
        },
        async save(state) {
            // Имитация сохранения в БД
            localStorage.setItem('financeState', JSON.stringify(state));
            // TODO: set(ref(db, 'users/' + userId), state);
        }
    };

    // --- State (Глобальное состояние) ---
    let state = {
        rates: { USD: 95, BTC: 60000, ETH: 3000, USDT: 1 },
        monthsLabels: ['Май', 'Июнь', 'Июль', 'Август'],
        
        categories: {
            expense: ['Еда', 'Авто', 'Дом', 'Развлечения', 'Подписки'],
            income: ['Зарплата', 'Проекты', 'Инвестиции']
        },
        
        accounts: [
            { id: 1, name: 'Т-Банк', type: 'fiat', balance: 120000 },
            { id: 2, name: 'Инвестиции', type: 'fiat', balance: 450000 },
            { id: 3, name: 'Наличка', type: 'fiat', balance: 15000 },
            { id: 4, name: 'Bybit', type: 'crypto', coin: 'USDT', balance: 1500 },
            { id: 5, name: 'Trust Wallet', type: 'crypto', coin: 'ETH', balance: 1.2 }
        ],
        
        history: {
            expense: {
                'Еда': [38000, 42000, 39500, 45000],
                'Авто': [12000, 15000, 10000, 15000],
                'Дом': [28000, 31000, 29000, 30000],
                'Развлечения': [15000, 22000, 18000, 20000],
                'Подписки': [4500, 4800, 5000, 5000]
            },
            income: {
                'Зарплата': [200000, 200000, 200000, 200000],
                'Проекты': [100000, 50000, 120000, 150000],
                'Инвестиции': [20000, 10000, 15000, 0]
            },
            cryptoPnL: [12000, -5000, 24000, 18000] // Доход с крипты в руб
        }
    };

    let charts = {}; 
    const currentMonthIndex = 3; // Индекс "Август"

    // Глобальные настройки Chart.js для отключения сеток (Apple style)
    Chart.defaults.scale.grid.display = false;
    Chart.defaults.scale.border.display = false;
    const blueColors = ['#007aff', '#34c759', '#ff9500', '#af52de', '#ff3b30', '#5ac8fa'];

    async function init() {
        const loaded = await DB.load();
        if(loaded) state = { ...state, ...loaded }; // Слияние дефолта и базы

        renderAll();
        await fetchLiveRates();
    }

    async function fetchLiveRates() {
        const statusEl = document.getElementById('rates-status');
        try {
            const fiatRes = await fetch('https://open.er-api.com/v6/latest/USD');
            const fiatData = await fiatRes.json();
            state.rates.USD = fiatData.rates.RUB;

            const cryptoRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether&vs_currencies=usd');
            const cryptoData = await cryptoRes.json();
            
            state.rates.BTC = cryptoData.bitcoin.usd;
            state.rates.ETH = cryptoData.ethereum.usd;
            state.rates.USDT = cryptoData.tether?.usd || 1;

            statusEl.className = 'live-status';
            statusEl.innerText = `🟢 Онлайн: 1$=${state.rates.USD.toFixed(1)}₽`;
            renderAccounts();
            if(document.getElementById('accounts').classList.contains('active')) initAccountsChart();
        } catch (e) {
            statusEl.className = 'live-status error';
            statusEl.innerText = '🔴 Ошибка курсов';
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');

        if(tabId === 'month') renderMonthTab();
        if(tabId === 'accounts') initAccountsChart();
        if(tabId === 'analytics') initAnalyticsCharts();
    }

    // --- Вкладка 1: Месяц и Категории ---
    function renderAll() {
        renderCategories();
        updateOpCategories();
        renderMonthTab();
        renderAccounts();
    }

    function renderMonthTab() {
        // Считаем тоталы
        let tInc = 0, tExp = 0;
        state.categories.income.forEach(cat => tInc += (state.history.income[cat]?.[currentMonthIndex] || 0));
        document.getElementById('month-income-total').innerText = `+ ${tInc.toLocaleString('ru-RU')} ₽`;

        // Сортировка расходов по убыванию
        let expensesArr = state.categories.expense.map(cat => ({
            name: cat, val: state.history.expense[cat]?.[currentMonthIndex] || 0
        })).filter(e => e.val > 0).sort((a, b) => b.val - a.val);

        expensesArr.forEach(e => tExp += e.val);
        document.getElementById('month-expense-total').innerText = `- ${tExp.toLocaleString('ru-RU')} ₽`;

        // Рендер списка
        const listEl = document.getElementById('current-month-expenses-list');
        listEl.innerHTML = expensesArr.map(e => `
            <div class="list-item" style="padding: 8px 0;">
                <span class="list-item-title">${e.name}</span>
                <span>${e.val.toLocaleString('ru-RU')} ₽</span>
            </div>
        `).join('');

        // Рендер графика
        if(charts.currentMonth) charts.currentMonth.destroy();
        const ctx = document.getElementById('currentMonthChart').getContext('2d');
        charts.currentMonth = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: expensesArr.map(e => e.name),
                datasets: [{ data: expensesArr.map(e => e.val), backgroundColor: blueColors, borderWidth: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
        });
    }

    function renderCategories() {
        const renderList = (type, listId) => {
            const list = document.getElementById(listId);
            list.innerHTML = state.categories[type].map((cat, idx) => `
                <div class="category-tag">
                    ${cat} <button class="action-btn" onclick="deleteCategory('${type}', ${idx})">×</button>
                </div>
            `).join('');
            
            // Заполнение селектов в аналитике
            const select = document.getElementById(`analytics-${type === 'expense' ? 'exp' : 'inc'}-select`);
            if(select) {
                select.innerHTML = state.categories[type].map(c => `<option value="${c}">${c}</option>`).join('');
            }
        };
        renderList('expense', 'exp-categories-list');
        renderList('income', 'inc-categories-list');
    }

    function updateOpCategories() {
        const type = document.getElementById('op-type').value;
        const select = document.getElementById('op-category');
        select.innerHTML = state.categories[type].map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function addCategory(type) {
        const inputId = type === 'expense' ? 'new-exp-category' : 'new-inc-category';
        const input = document.getElementById(inputId);
        const val = input.value.trim();
        if(val && !state.categories[type].includes(val)) {
            state.categories[type].push(val);
            state.history[type][val] = [0,0,0,0]; // Инициализация истории
            input.value = '';
            renderCategories();
            updateOpCategories();
            DB.save(state);
        }
    }

    function deleteCategory(type, index) {
        const cat = state.categories[type][index];
        state.categories[type].splice(index, 1);
        delete state.history[type][cat];
        renderCategories();
        updateOpCategories();
        renderMonthTab();
        DB.save(state);
    }

    function addTransaction() {
        const type = document.getElementById('op-type').value;
        const amount = Number(document.getElementById('op-amount').value);
        const cat = document.getElementById('op-category').value;
        if(!amount) return;
        
        state.history[type][cat][currentMonthIndex] += amount;
        document.getElementById('op-amount').value = '';
        renderMonthTab();
        DB.save(state);
    }

    // --- Вкладка 2: Счета ---
    function toggleCoinInput() {
        const isCrypto = document.getElementById('new-acc-type').value === 'crypto';
        document.getElementById('new-acc-coin').style.display = isCrypto ? 'block' : 'none';
    }

    function renderAccounts() {
        let totalRub = 0;
        const list = document.getElementById('accounts-list');
        list.innerHTML = '';

        state.accounts.forEach(acc => {
            let rubValue = 0;
            let displayVal = '';

            if(acc.type === 'fiat') {
                rubValue = acc.balance;
                displayVal = `${acc.balance.toLocaleString('ru-RU')} ₽`;
            } else {
                const coinRate = state.rates[acc.coin?.toUpperCase()] || 0;
                const usdValue = acc.balance * coinRate;
                rubValue = usdValue * state.rates.USD;
                displayVal = `${acc.balance} ${acc.coin} ($${usdValue.toLocaleString('en-US',{maximumFractionDigits:2})})`;
            }
            
            totalRub += rubValue;
            list.innerHTML += `
                <div class="list-item">
                    <div>
                        <div class="list-item-title">${acc.name} <span style="font-size:12px; color:var(--text-muted)">${acc.type.toUpperCase()}</span></div>
                        <div class="subtitle">${displayVal} ${acc.type === 'crypto' ? `(~${Math.round(rubValue).toLocaleString('ru-RU')} ₽)` : ''}</div>
                    </div>
                    <button class="action-btn" onclick="deleteAccount(${acc.id})">×</button>
                </div>
            `;
        });

        document.getElementById('total-capital').innerText = Math.round(totalRub).toLocaleString('ru-RU') + ' ₽';
    }

    function addAccount() {
        const name = document.getElementById('new-acc-name').value;
        const type = document.getElementById('new-acc-type').value;
        const balance = Number(document.getElementById('new-acc-balance').value);
        const coin = document.getElementById('new-acc-coin').value.toUpperCase();

        if(!name || !balance || (type === 'crypto' && !coin)) return alert('Заполните поля');

        state.accounts.push({ id: Date.now(), name, type, balance, coin });
        renderAccounts();
        if(document.getElementById('accounts').classList.contains('active')) initAccountsChart();
        DB.save(state);
        
        document.getElementById('new-acc-name').value = '';
        document.getElementById('new-acc-balance').value = '';
    }

    function deleteAccount(id) {
        state.accounts = state.accounts.filter(a => a.id !== id);
        renderAccounts();
        initAccountsChart();
        DB.save(state);
    }

    function initAccountsChart() {
        if(charts.accounts) charts.accounts.destroy();
        const ctx = document.getElementById('accountsChart').getContext('2d');
        
        const data = state.accounts.map(acc => {
            if(acc.type === 'fiat') return acc.balance;
            return acc.balance * (state.rates[acc.coin] || 0) * state.rates.USD;
        });

        charts.accounts = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: state.accounts.map(a => a.name), datasets: [{ data, backgroundColor: blueColors, borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
        });
    }

    // --- Вкладка 3: Аналитика ---
    function updateAnalyticsCharts() {
        const expCat = document.getElementById('analytics-exp-select').value;
        const incCat = document.getElementById('analytics-inc-select').value;

        if(charts.expHistory && expCat) {
            charts.expHistory.data.datasets[0].data = state.history.expense[expCat] || [0,0,0,0];
            charts.expHistory.update();
        }
        if(charts.incHistory && incCat) {
            charts.incHistory.data.datasets[0].data = state.history.income[incCat] || [0,0,0,0];
            charts.incHistory.update();
        }
    }

    function initAnalyticsCharts() {
        const commonLineOptions = { 
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            elements: { line: { tension: 0.4 }, point: { radius: 4 } }
        };

        // 1. Расходы
        if(charts.expHistory) charts.expHistory.destroy();
        const catExp = document.getElementById('analytics-exp-select').value || state.categories.expense[0];
        charts.expHistory = new Chart(document.getElementById('chartExpHistory'), {
            type: 'line',
            data: { labels: state.monthsLabels, datasets: [{ data: state.history.expense[catExp] || [0,0,0,0], borderColor: '#1c1c1e', backgroundColor: 'rgba(28, 28, 30, 0.1)', fill: true }] },
            options: commonLineOptions
        });

        // 2. Доходы
        if(charts.incHistory) charts.incHistory.destroy();
        const catInc = document.getElementById('analytics-inc-select').value || state.categories.income[0];
        charts.incHistory = new Chart(document.getElementById('chartIncHistory'), {
            type: 'line',
            data: { labels: state.monthsLabels, datasets: [{ data: state.history.income[catInc] || [0,0,0,0], borderColor: '#34c759', backgroundColor: 'rgba(52, 199, 89, 0.15)', fill: true }] },
            options: commonLineOptions
        });

        // 3. Крипта PnL
        if(charts.cryptoHistory) charts.cryptoHistory.destroy();
        charts.cryptoHistory = new Chart(document.getElementById('chartCryptoHistory'), {
            type: 'bar',
            data: { 
                labels: state.monthsLabels, 
                datasets: [{ 
                    data: state.history.cryptoPnL, 
                    backgroundColor: ctx => ctx.raw > 0 ? '#007aff' : '#ff3b30', 
                    borderRadius: 6 
                }] 
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        // 4. Тренд (Суммарно Доходы vs Расходы)
        if(charts.trend) charts.trend.destroy();
        
        let totalIncArr = [0,0,0,0], totalExpArr = [0,0,0,0];
        state.monthsLabels.forEach((_, i) => {
            state.categories.income.forEach(c => totalIncArr[i] += (state.history.income[c]?.[i] || 0));
            state.categories.expense.forEach(c => totalExpArr[i] += (state.history.expense[c]?.[i] || 0));
        });

        charts.trend = new Chart(document.getElementById('chartTrend'), {
            type: 'bar',
            data: {
                labels: state.monthsLabels,
                datasets: [
                    { label: 'Доходы', data: totalIncArr, backgroundColor: '#34c759', borderRadius: 6 },
                    { label: 'Расходы', data: totalExpArr, backgroundColor: '#1c1c1e', borderRadius: 6 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    window.onload = init;
</script>
</body>
</html>
